networks:
  e2e-net:
    name: qd-e2e-net

services:
  postgres:
    image: postgres:17-alpine
    networks:
      - e2e-net
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app-image:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    image: qd-e2e-app:latest
    networks:
      - e2e-net
    profiles: ["build"]
    command: "true"
